name: Release
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan and test without accessing signing secrets or publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan from latest published release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT" == workflow_dispatch && "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Dispatch releases from the default branch; push an explicit tag for a tagged release."
            exit 1
          fi
          previous="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          args=(--previous "$previous")
          if [[ "$EVENT" == push ]]; then args+=(--tag "$REF_NAME"); fi
          python3 Resources/ReleaseTools/PlanRelease.py "${args[@]}"
  verify:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
  build:
    needs: [plan, verify]
    if: needs.plan.outputs.release == 'true' && inputs.dry_run != true
    runs-on: macos-15
    timeout-minutes: 60
    # Configure this environment to require maintainer approval before secrets are released.
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.head }}
      - name: Require explicitly provisioned update-signing material
        env:
          PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          if [[ -z "$PUBLIC_KEY" || -z "$PRIVATE_KEY" ]]; then
            echo "::error::Release signing is not provisioned. Configure the release environment explicitly; no unsigned release or new key will be generated."
            exit 1
          fi
      - name: Install missing validation tools
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          command -v actionlint >/dev/null || brew install actionlint
      - name: Validate release tag and workflows
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Only stable vMAJOR.MINOR.PATCH releases are supported'; exit 1;
          }
          actionlint
      - name: Build and authenticate release
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          ARCH: universal
          # CEF public releases are gated on security review and both-architecture packaging.
          CAIRN_WITH_CHROMIUM: '0'
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          export VERSION="${RELEASE_TAG#v}"
          export BUILD_NUMBER="$VERSION"
          scripts/release.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: authenticated-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: authenticated-release
          path: release
      - name: Verify transferred artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.head }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          current="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          if [[ "$current" != "$PREVIOUS_TAG" ]]; then
            echo "::error::The latest release changed during this run. Re-plan instead of publishing stale assets."
            exit 1
          fi
          existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq '.[].ref')"
          if grep -Fxq "refs/tags/$RELEASE_TAG" <<< "$existing"; then
            tagged_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
            if [[ "$tagged_commit" != "$RELEASE_COMMIT" ]]; then
              echo "::error::The release tag no longer identifies the tested commit."
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" --silent \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_COMMIT"
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Cairn $RELEASE_TAG" --notes-file RELEASE-NOTES.txt \
            ./*.zip ./*.dmg appcast.xml SHA256SUMS RELEASE-INFO.json
