name: Release
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan and test without accessing signing secrets or publishing
        type: boolean
        default: true
      chromium_risk_acknowledgement:
        description: Written acknowledgement (one line, 20-500 characters) of the outstanding Chromium security gap and its validation; only needed while the gate blocks
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan from latest published release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT" == workflow_dispatch && "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Dispatch releases from the default branch; push an explicit tag for a tagged release."
            exit 1
          fi
          previous="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          args=(--previous "$previous")
          if [[ "$EVENT" == push ]]; then args+=(--tag "$REF_NAME"); fi
          python3 Resources/ReleaseTools/PlanRelease.py "${args[@]}"
  verify:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
  # Fails closed while the pinned Chromium trails Chrome stable, unless a maintainer acknowledges the gap in writing.
  chromium-gate:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.head }}
      - name: Check the pinned Chromium for outstanding security gaps
        env:
          CHROMIUM_RISK_ACKNOWLEDGEMENT: ${{ inputs.chromium_risk_acknowledgement }}
        run: python3 Resources/ReleaseTools/ChromiumGate.py --output chromium-gate/chromium-gate.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chromium-gate
          path: chromium-gate/chromium-gate.json
          if-no-files-found: error
          retention-days: 14
  # Chromium (CEF) is the only engine and is single-architecture, so each architecture builds on its own runner.
  build:
    needs: [plan, verify, chromium-gate]
    if: needs.plan.outputs.release == 'true' && inputs.dry_run != true
    strategy:
      # A failing architecture must not cancel the other one: its assets stay available, so "Re-run failed jobs"
      # rebuilds only the architecture that failed.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Configure this environment to require maintainer approval before secrets are released.
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.head }}
      - name: Require the explicitly provisioned update-signing public key
        env:
          PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          if [[ -z "$PUBLIC_KEY" ]]; then
            echo "::error::Release signing is not provisioned. Configure the release environment explicitly; no unsigned release or new key will be generated."
            exit 1
          fi
      - name: Install missing validation tools
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          command -v actionlint >/dev/null || brew install actionlint
      - name: Validate release tag and workflows
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Only stable vMAJOR.MINOR.PATCH releases are supported'; exit 1;
          }
          actionlint
      - name: Prepare Chromium
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 engine/tool.py fetch --arch "$ARCH"
          python3 engine/tool.py build --arch "$ARCH"
      - name: Build ${{ matrix.arch }} release
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          export VERSION="${RELEASE_TAG#v}"
          export BUILD_NUMBER="$VERSION"
          scripts/release.sh
      # The notarization verdicts and the packaging test logs are copied out of .build because upload-artifact skips
      # hidden paths, which would silently upload nothing.
      - name: Collect release logs
        if: ${{ failure() }}
        run: |
          mkdir -p release-logs
          shopt -s nullglob
          for log in .build/notarization-result.json .build/dmg-notarization-result.json .build/release-tests/*.log; do
            if [[ -f "$log" ]]; then cp "$log" "release-logs/$(basename "$log")"; fi
          done
      - name: Keep release logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-logs-${{ matrix.arch }}
          path: release-logs
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/release/Cairn-*-${{ matrix.arch }}.zip
            dist/release/Cairn-*-${{ matrix.arch }}.dmg
            dist/release/Cairn-*-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14
  # The only job that holds the Sparkle private key: it signs both architectures into one update feed.
  finalize:
    needs: [plan, chromium-gate, build]
    runs-on: macos-15
    timeout-minutes: 30
    # Configure this environment to require maintainer approval before the update-signing key is released.
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.head }}
      - name: Require explicitly provisioned update-signing material
        env:
          PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          if [[ -z "$PUBLIC_KEY" || -z "$PRIVATE_KEY" ]]; then
            echo "::error::Release signing is not provisioned. Configure the release environment explicitly; no unsigned release or new key will be generated."
            exit 1
          fi
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: chromium-gate
          path: chromium-gate
      - name: Authenticate release
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          CAIRN_CHROMIUM_GATE_RECORD: chromium-gate/chromium-gate.json
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          export VERSION="${RELEASE_TAG#v}"
          scripts/finalize-release.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: authenticated-release
          path: |
            dist/release/*.zip
            dist/release/*.dmg
            dist/release/appcast.xml
            dist/release/SHA256SUMS
            dist/release/RELEASE-INFO.json
            dist/release/RELEASE-NOTES.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [plan, finalize]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: authenticated-release
          path: release
      - name: Verify transferred artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.head }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous }}
        run: |
          set -euo pipefail
          cd release
          version="${RELEASE_TAG#v}"
          # Exactly what the finalize job authenticated: both architectures, the shared feed and its metadata.
          assets=("Cairn-$version-arm64.dmg" "Cairn-$version-arm64.zip" "Cairn-$version-x86_64.dmg"
            "Cairn-$version-x86_64.zip" RELEASE-INFO.json SHA256SUMS appcast.xml)
          # RELEASE-NOTES.txt becomes the release body rather than an uploaded asset.
          expected="$(printf '%s\n' "${assets[@]}" RELEASE-NOTES.txt | LC_ALL=C sort)"
          shopt -s dotglob nullglob
          found=(*)
          if [[ "$(printf '%s\n' "${found[@]}" | LC_ALL=C sort)" != "$expected" ]]; then
            echo "::error::The authenticated release does not contain exactly the expected files."
            exit 1
          fi
          for name in "${found[@]}"; do
            [[ -f "$name" && ! -L "$name" ]] || { echo "::error::$name is not a regular file."; exit 1; }
          done
          if [[ "$(awk '{print $2}' SHA256SUMS | LC_ALL=C sort)" != "$(grep -Fxv SHA256SUMS <<< "$expected")" ]]; then
            echo "::error::SHA256SUMS does not cover exactly the other published files."
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS
          current="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          if [[ "$current" != "$PREVIOUS_TAG" ]]; then
            echo "::error::The latest release changed during this run. Re-plan instead of publishing stale assets."
            exit 1
          fi
          existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq '.[].ref')"
          if grep -Fxq "refs/tags/$RELEASE_TAG" <<< "$existing"; then
            tagged_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
            if [[ "$tagged_commit" != "$RELEASE_COMMIT" ]]; then
              echo "::error::The release tag no longer identifies the tested commit."
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" --silent \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_COMMIT"
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Cairn $RELEASE_TAG" --notes-file RELEASE-NOTES.txt "${assets[@]}"
