name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture (publish universal for the stable feed)
        type: choice
        options: [universal, arm64]
        default: universal
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 60
    # Configure this environment to require maintainer approval before secrets are released.
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install missing validation tools
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          command -v actionlint >/dev/null || brew install actionlint
      - name: Validate release tag and workflows
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Only stable vMAJOR.MINOR.PATCH releases are supported'; exit 1;
          }
          actionlint
      - name: Build and authenticate release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARCH: ${{ inputs.architecture || 'universal' }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          export VERSION="${RELEASE_TAG#v}"
          export BUILD_NUMBER="$VERSION"
          scripts/release.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: authenticated-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: authenticated-release
          path: release
      - name: Verify transferred artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Cairn $RELEASE_TAG" --notes-file RELEASE-NOTES.txt \
            ./*.zip ./*.dmg appcast.xml SHA256SUMS RELEASE-INFO.json
