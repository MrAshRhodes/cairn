name: Chromium maintenance

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-maintenance
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.check.outputs.status }}
      update: ${{ steps.check.outputs.update }}
      gap: ${{ steps.check.outputs.gap }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Offline updater tests
        run: python3 -m unittest discover -s engine/tests -v
      - name: Compare stable CEF and Chrome
        id: check
        run: |
          mkdir -p chromium-status
          # The tool also writes both reports when it fails (status "failed"), so the outputs, summary and tracking
          # issue below always have something to report; the exit code is applied at the end.
          code=0
          python3 engine/tool.py check --report chromium-status/status.json --markdown chromium-status/status.md || code=$?
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("chromium-status/status.json")
          report = json.loads(path.read_text()) if path.exists() else {"status": "failed"}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"status={report['status']}\n")
              output.write(f"update={str(bool(report.get('update_available'))).lower()}\n")
              output.write(f"gap={str(bool(report.get('security_gap'))).lower()}\n")
          summary = Path("chromium-status/status.md")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(summary.read_text() if summary.exists() else "## Chromium maintenance check failed\n")
          if report.get("security_gap"):
              print("::warning::SECURITY GAP: CEF is behind Chrome stable. See summary; do not describe this engine as current Chrome.")
          if report.get("missing_architectures"):
              print("::warning::ARCHITECTURE GAP: " + ", ".join(report["missing_architectures"]) + " has no build of the newest stable CEF yet; the pin can only move to a build both architectures publish.")
          PY
          exit "$code"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: chromium-status
          path: chromium-status
          if-no-files-found: ignore
          retention-days: 14
          # A re-run of this job replaces the report the tracking issue reads.
          overwrite: true

  propose:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pin the newest stable build published for both architectures
        run: |
          mkdir -p chromium-status
          python3 engine/tool.py update --report chromium-status/update.json --markdown chromium-status/update.md
      # The CEF index only publishes SHA-1: download both archives (size and SHA-1 verified) and record their SHA-256.
      - name: Record the SHA-256 of both archives
        run: python3 engine/tool.py hash
      - name: Offline tests against the new pin
        run: python3 -m unittest discover -s engine/tests -v
      - name: Describe the change
        run: cat chromium-status/update.md .github/chromium-bump-pr.md > chromium-status/pr-body.md
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        id: pr
        with:
          branch: maintenance/cef-stable
          title: 'Update pinned CEF stable (manual security review required)'
          commit-message: 'Update pinned CEF stable archives'
          add-paths: engine/cef.lock.json
          labels: chromium-security
          draft: always-true
          body-path: chromium-status/pr-body.md
      # Pushes made with the default token do not start pull_request workflows. workflow_dispatch is exempt, so run CI
      # for the branch explicitly; its checks attach to the pull request's head commit.
      - name: Start CI for the pull request
        if: ${{ steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"

  # One open issue says whenever the pin is behind Chrome stable or the check cannot run, and closes itself afterwards.
  tracking-issue:
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        continue-on-error: true
        with:
          name: chromium-status
          path: chromium-status
      - name: Open, refresh or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/chromium-issue.sh chromium-status/status.json chromium-status/status.md

  security-gap:
    needs: check
    if: needs.check.outputs.gap == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require maintainer attention
        run: |
          echo "::error::SECURITY GAP remains in the pinned Chromium engine. The release workflow's chromium-gate blocks releases until the pin is updated or a maintainer records a written risk acknowledgement; review the maintenance summary."
          exit 1
